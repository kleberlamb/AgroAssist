<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Plantação - AgroAssist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 Adicionar Plantação</h1>
        </div>

        <div class="form-group">
            <label>🌿 Nome da Planta</label>
            <input type="text" id="nomePlanta" placeholder="Ex: Tomate">
        </div>

        <div class="form-group">
            <label>🔢 Quantidade</label>
            <input type="number" id="quantidadePlanta" placeholder="Ex: 20">
        </div>

        <div class="form-group">
            <label>📅 Data do transplante</label>
            <input type="date" id="dataTransplante">
        </div>

        <div class="form-group">
            <label>📝 Observações</label>
            <textarea id="obsPlantacao" rows="3" placeholder="Ex: Canteiro A, adubação orgânica..."></textarea>
        </div>

        <button class="btn" onclick="salvarPlantacao()">💾 Salvar</button>
        <br><br>
        <a href="index.html" class="voltar">⬅️ Voltar</a>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
    <script>
        window.onload = function() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataTransplante').value = hoje;

            const params = new URLSearchParams(window.location.search);
            const planta = params.get('planta');
            if (planta) {
                document.getElementById('nomePlanta').value = planta;
            }
        };
    </script>
</body>
</html>
